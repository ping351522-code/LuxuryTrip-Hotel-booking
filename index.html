<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="hero_title">Luxury Trip - Hotel Booking</title>
    
    <!-- Modular CSS Files -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="customer.css">
    <link rel="stylesheet" href="language.css">
    <link rel="stylesheet" href="membership.css">
    <link rel="stylesheet" href="withdrawal.css">
    <link rel="stylesheet" href="useful.css">
    <link rel="stylesheet" href="logout.css">
</head>
<body>

    <!-- Header Navigation Bar with Language Switcher & Logout -->
    <header>
        <div class="logo" data-i18n="hero_title">LUXURY TRIP</div>
        
        <div style="display: flex; gap: 15px; align-items: center;">
            <!-- Language Switcher Container -->
            <div id="languageSwitcherContainer"></div>
            
            <!-- Logout Button -->
            <button class="logout-btn" id="logoutBtn" type="button">
                <span data-i18n="nav_logout">Logout</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <div class="container">
        <div class="hero-section">
            <h1 id="mainTitle" data-i18n="hero_title">Luxury Hotel & Resort Booking</h1>
            <p id="mainSubtitle" data-i18n="hero_subtitle">Experience world-class hospitality across Asia</p>
        </div>

        <!-- User Dashboard / Profile Card as seen in screenshot -->
        <div style="background: #1e1e1e; border: 1px solid #333; padding: 25px; border-radius: 12px; max-width: 500px; margin: 0 auto; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <h3 style="color: #d4af37; margin-bottom: 15px;">ကြိုဆိုပါတယ်, Po Kaing</h3>
            <div style="background: #121212; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333;">
                <p style="color: #aaa; font-size: 13px;">အကောင့်ဝင်ငွေကျန်ငွေ (BALANCE)</p>
                <h2 style="color: #2ecc71; margin-top: 5px;">0 Ks</h2>
            </div>
            <button class="book-btn" data-i18n="btn_book">Book Now</button>
        </div>
    </div>

    <!-- Modular JavaScript Files -->
    <script src="language.js"></script>
    <script src="membership.js"></script>
    <script src="withdrawal.js"></script>
    <script src="useful.js"></script>
    <script src="logout.js"></script>
    <script src="customer.js"></script>
    <script src="script.js"></script>
</body>
</html>
