<!DOCTYPE html>
<html lang="my" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login & Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --error: #ef4444;
            --hover: #2e3b55;
        }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 10px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .hidden { display: none !important; }

        /* Login Box Styles */
        .login-container { width: 100%; max-width: 400px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .login-container h2 { text-align: center; margin-top: 0; margin-bottom: 20px; font-size: 22px; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px 14px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 13px; outline: none; }
        .form-group input:focus { border-color: var(--primary); }
        .btn-login { width: 100%; background: linear-gradient(135deg, var(--primary), #6366f1); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px; }

        /* Admin Dashboard Layout */
        .admin-wrapper { width: 100%; max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; }
        .header h2 { margin: 0; font-size: 16px; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
        .nav-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 12px; }
        .nav-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .main-layout { display: flex; gap: 10px; align-items: flex-start; }
        .left-panel { width: 280px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 10px; }
        .right-panel { flex: 1; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 15px; margin-bottom: 50px; }

        .search-input { width: 100%; padding: 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 13px; outline: none; margin-bottom: 8px; }
        .user-list { display: flex; flex-direction: column; gap: 6px; max-height: 70vh; overflow-y: auto; }
        .user-card { background: rgba(15, 23, 42, 0.5); padding: 10px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
        .user-card:hover, .user-card.active { background: var(--hover); border-color: var(--primary); }
        .user-card h4 { margin: 0 0 2px 0; font-size: 13px; color: #f1f5f9; }
        .user-card p { margin: 0; font-size: 11px; color: var(--text-muted); }

        .section-title { font-size: 15px; font-weight: 700; color: #818cf8; margin-top: 0; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
        .info-box { background: rgba(15, 23, 42, 0.6); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); }
        .info-box span { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 2px; }
        .info-box strong { font-size: 13px; color: #f8fafc; word-break: break-all; }

        .control-form { background: rgba(15, 23, 42, 0.4); padding: 10px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px; }
        .form-row { margin-bottom: 8px; }
        .form-row label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 3px; }
        .form-row input { width: 100%; padding: 8px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); font-size: 13px; outline: none; }
        .btn-save { background: linear-gradient(135deg, var(--success), #16a34a); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; width: 100%; margin-top: 5px; }

        .admin-chat-section { background: rgba(15, 23, 42, 0.7); padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-top: 15px; }
        .chat-messages { height: 220px; overflow-y: auto; background: rgba(15, 23, 42, 0.95); padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--border); }
        .message { padding: 6px 10px; border-radius: 8px; max-width: 85%; font-size: 12px; word-break: break-word; }
        .message.user { background: var(--border); color: var(--text-main); align-self: flex-start; }
        .message.admin { background: var(--primary); color: white; align-self: flex-end; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row input { flex: 1; padding: 8px 10px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); font-size: 12px; outline: none; }
        .btn-chat-send { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; white-space: nowrap; }
        .btn-logout { background: transparent; border: 1px solid var(--error); color: var(--error); padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600; }

        .empty-state { text-align: center; color: var(--text-muted); margin-top: 60px; font-size: 13px; }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .left-panel { width: 100%; }
        }
    </style>
</head>
<body>

<!-- Admin Login Container -->
<div class="login-container" id="adminLoginBox">
    <h2>🔐 Admin အကောင့်ဝင်ရန်</h2>
    <div class="form-group">
        <label>Username</label>
        <input type="text" id="adminUser" placeholder="Username ထည့်ပါ...">
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPass" placeholder="••••••••">
    </div>
    <button class="btn-login" onclick="handleAdminLogin()">အကောင့်ဝင်မည်</button>
</div>

<!-- Admin Main Dashboard Container -->
<div class="admin-wrapper hidden" id="adminDashboardBox">
    <div class="header">
        <h2>⚡ Admin Management & Messages Center</h2>
        <button class="btn-logout" onclick="handleAdminLogout()">ထွက်မည်</button>
    </div>

    <div class="nav-tabs">
        <button class="nav-btn active" id="tabUsers" onclick="switchMainTab('users')">👥 User စီမံရန်</button>
        <button class="nav-btn" id="tabMessages" onclick="switchMainTab('messages')">💬 မက်ဆေ့ချ် အဝင်များ</button>
    </div>

    <div class="main-layout">
        <div class="left-panel">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 ရှာရန်..." onkeyup="filterList()">
            <div class="user-list" id="listContainer">
                <p style="color: var(--text-muted); text-align: center; margin-top: 15px;">ဒေတာ ရယူနေသည်...</p>
            </div>
        </div>
        <div class="right-panel" id="rightPanel">
            <div class="empty-state">
                👈 ဘယ်ဘက်စာရင်းမှ User တစ်ဦးကို ရွေးချယ်ပါ
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB1DGwjqxNa7niZF0hWUPM0xbW_-Q_Gvz4",
    authDomain: "tripbooking-app-cd1b8.firebaseapp.com",
    databaseURL: "https://tripbooking-app-cd1b8-default-rtdb.firebaseio.com",
    projectId: "tripbooking-app-cd1b8",
    storageBucket: "tripbooking-app-cd1b8.appspot.com",
    messagingSenderId: "278352913024",
    appId: "1:278352913024:web:e699747583010a294f3c65"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  let allUsersData = {};
  let allChatsData = {};
  let activeTab = 'users';
  let activeSelectedUserId = null;

  window.onload = function() {
    if(localStorage.getItem('isAdminLoggedIn') === 'true') {
      showDashboard();
    }
  };

  function handleAdminLogin() {
    const user = document.getElementById('adminUser').value.trim();
    const pass = document.getElementById('adminPass').value.trim();

    if(user === 'Po Kaing Kaing' && pass === '2006105351522') {
      localStorage.setItem('isAdminLoggedIn', 'true');
      showDashboard();
    } else {
      alert('Username သို့မဟုတ် Password မှားယွင်းနေပါသည်။');
    }
  }

  function showDashboard() {
    document.getElementById('adminLoginBox').classList.add('hidden');
    document.getElementById('adminDashboardBox').classList.remove('hidden');
    initAdminData();
  }

  function handleAdminLogout() {
    localStorage.removeItem('isAdminLoggedIn');
    location.reload();
  }

  function initAdminData() {
    db.ref('users').on('value', snapshot => {
      allUsersData = snapshot.val() || {};
      if(activeTab === 'users') renderUserList(allUsersData);
    });

    db.ref('chats').on('value', snapshot => {
      allChatsData = snapshot.val() || {};
      if(activeTab === 'messages') renderMessagesList(allChatsData);
    });
  }

  function switchMainTab(tab) {
    activeTab = tab;
    document.getElementById('tabUsers').classList.toggle('active', tab === 'users');
    document.getElementById('tabMessages').classList.toggle('active', tab === 'messages');
    document.getElementById('searchInput').value = '';

    if(tab === 'users') {
      renderUserList(allUsersData);
    } else {
      renderMessagesList(allChatsData);
    }
  }

  function renderUserList(users) {
    const container = document.getElementById('listContainer');
    container.innerHTML = "";
    const keys = Object.keys(users);

    if (keys.length === 0) {
      container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">User မရှိသေးပါ။</p>';
      return;
    }

    keys.forEach(userId => {
      const u = users[userId];
      const card = document.createElement('div');
      card.className = 'user-card';
      if(activeSelectedUserId === userId) card.classList.add('active');
      card.innerHTML = `
        <h4>${u.fullName || 'အမည်မသိ'}</h4>
        <p>ID: <strong>${u.userId || userId}</strong> | ဖုန်း: ${u.phone || '-'}</p>
      `;
      card.onclick = () => selectUser(userId, card);
      container.appendChild(card);
    });
  }

  function renderMessagesList(chats) {
    const container = document.getElementById('listContainer');
    container.innerHTML = "";
    const userIds = Object.keys(chats);

    if (userIds.length === 0) {
      container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">မက်ဆေ့ချ်အဝင်များ မရှိသေးပါ။</p>';
      return;
    }

    userIds.forEach(userId => {
      const uInfo = allUsersData[userId] || { fullName: 'User ID: ' + userId, phone: '-' };
      const card = document.createElement('div');
      card.className = 'user-card';
      if(activeSelectedUserId === userId) card.classList.add('active');
      card.innerHTML = `
        <h4>💬 ${uInfo.fullName}</h4>
        <p>ID: <strong>${userId}</strong></p>
      `;
      card.onclick = () => selectUser(userId, card);
      container.appendChild(card);
    });
  }

  function filterList() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    if(activeTab === 'users') {
      const filtered = {};
      Object.keys(allUsersData).forEach(id => {
        const u = allUsersData[id];
        if((u.fullName || '').toLowerCase().includes(query) || (u.userId || id).toLowerCase().includes(query)) {
          filtered[id] = u;
        }
      });
      renderUserList(filtered);
    }
  }

  function selectUser(userId, cardEl) {
    document.querySelectorAll('.user-card').forEach(c => c.classList.remove('active'));
    if(cardEl) cardEl.classList.add('active');
    activeSelectedUserId = userId;

    const u = allUsersData[userId] || { userId: userId, fullName: 'N/A', phone: 'N/A', inviteCode: 'N/A', balance: 0, bookingCount: 0, bookingValue: 10000 };

    const rightPanel = document.getElementById('rightPanel');
    rightPanel.innerHTML = `
      <h3 class="section-title">👤 User အချက်အလက်နှင့် ငွေကြေးထိန်းချုပ်မှု</h3>
      
      <div class="info-grid">
        <div class="info-box">
          <span>User ID</span>
          <strong>${u.userId || userId}</strong>
        </div>
        <div class="info-box">
          <span>အမည်</span>
          <strong>${u.fullName || 'N/A'}</strong>
        </div>
        <div class="info-box">
          <span>ဖုန်း</span>
          <strong>${u.phone || 'N/A'}</strong>
        </div>
        <div class="info-box">
          <span>Invite Code</span>
          <strong>${u.inviteCode || 'N/A'}</strong>
        </div>
      </div>

      <div class="control-form">
        <div class="form-row">
          <label>လက်ကျန်ငွေ (Balance):</label>
          <input type="number" id="adminBalance" value="${u.balance !== undefined ? u.balance : 0}" step="any" required>
        </div>
        <div class="form-row">
          <label>Booking အကြိမ် (/60):</label>
          <input type="number" id="adminBookingCount" value="${u.bookingCount !== undefined ? u.bookingCount : 0}" min="0" max="60" required>
        </div>
        <div class="form-row">
          <label>Order Value:</label>
          <input type="number" id="adminBookingValue" value="${u.bookingValue !== undefined ? u.bookingValue : 10000}" step="any" required>
        </div>
        <button type="button" class="btn-save" onclick="updateUserByAdmin('${userId}')">💾 သိမ်းရန်</button>
      </div>

      <div class="admin-chat-section">
        <h4 style="margin-top:0; color: #818cf8; margin-bottom:10px;">💬 တိုက်ရိုက်ချတ်ပြောရန် (Live Chatbox)</h4>
        <div class="chat-messages" id="adminChatMessages">
          <p style="color: var(--text-muted); text-align: center;">စာများ ရယူနေသည်...</p>
        </div>
        <div class="chat-input-row">
          <input type="text" id="adminChatInput" placeholder="စာပြန်ရန်..." onkeypress="handleAdminChatKey(event, '${userId}')">
          <button class="btn-chat-send" onclick="sendAdminMessage('${userId}')">ပို့မည်</button>
        </div>
      </div>
    `;

    loadAdminChat(userId);
  }

  function loadAdminChat(userId) {
    db.ref('chats/' + userId).on('value', snap => {
      const chatData = snap.val() || {};
      const container = document.getElementById('adminChatMessages');
      if(!container) return;
      container.innerHTML = "";

      if(Object.keys(chatData).length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">ပြောဆိုထားသော စာများ မရှိသေးပါ။</p>';
        return;
      }

      Object.keys(chatData).forEach(msgKey => {
        const msg = chatData[msgKey];
        const div = document.createElement('div');
        div.className = `message ${msg.sender}`;
        div.innerText = msg.text;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    });
  }

  function sendAdminMessage(userId) {
    const input = document.getElementById('adminChatInput');
    const text = input.value.trim();
    if(!text) return;

    db.ref('chats/' + userId).push({
      sender: 'admin',
      text: text,
      timestamp: Date.now()
    }).then(() => {
      input.value = '';
    });
  }

  function handleAdminChatKey(e, userId) {
    if(e.key === 'Enter') {
      sendAdminMessage(userId);
    }
  }

  function updateUserByAdmin(userId) {
    const newBalance = parseFloat(document.getElementById('adminBalance').value);
    const newCount = parseInt(document.getElementById('adminBookingCount').value);
    const newVal = parseFloat(document.getElementById('adminBookingValue').value);

    db.ref('users/' + userId).update({
      balance: newBalance,
      bookingCount: newCount,
      bookingValue: newVal
    }).then(() => {
      alert('✨ အောင်မြင်စွာ ပြင်ဆင်ပြီးပါပြီ!');
    }).catch(err => {
      alert('အမှားအယွင်းရှိသည်: ' + err.message);
    });
  }
</script>

</body>
</html>
